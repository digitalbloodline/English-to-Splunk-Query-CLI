name: Release Windows Zip Bundle

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to upload the asset to (e.g. v1.0.0)'
        required: true
        type: string

jobs:
  build-and-release-zip:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Checkout requested tag when available
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        env:
          DISPATCH_TAG: ${{ github.event.inputs.tag }}
        run: |
          $ErrorActionPreference = 'Stop'
          git fetch --tags --force
          git show-ref --verify --quiet "refs/tags/$env:DISPATCH_TAG"
          if ($LASTEXITCODE -eq 0) {
            git checkout "refs/tags/$env:DISPATCH_TAG"
          } else {
            throw "Tag '$env:DISPATCH_TAG' was not found."
          }

      - name: Resolve release tag and binary
        id: resolve
        shell: pwsh
        env:
          DISPATCH_TAG: ${{ github.event.inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          $ErrorActionPreference = 'Stop'

          $releaseTag = if ($env:REF_TYPE -eq 'tag') { $env:REF_NAME } else { $env:DISPATCH_TAG }
          if ([string]::IsNullOrWhiteSpace($releaseTag)) {
            throw 'Release tag is required (tag push or workflow_dispatch input).'
          }

          $metadata = cargo metadata --no-deps --format-version 1 | ConvertFrom-Json

          $package = $null
          if (-not [string]::IsNullOrWhiteSpace($metadata.resolve.root)) {
            $package = $metadata.packages |
              Where-Object { $_.id -eq $metadata.resolve.root } |
              Select-Object -First 1
          }

          if (-not $package) {
            $defaultMembers = @($metadata.workspace_default_members)
            if ($defaultMembers.Count -eq 1) {
              $package = $metadata.packages |
                Where-Object { $_.id -eq $defaultMembers[0] } |
                Select-Object -First 1
            } elseif ($defaultMembers.Count -gt 1) {
              throw 'Multiple workspace default members found. Run workflow from target package or simplify workspace defaults.'
            }
          }

          if (-not $package) {
            $workspaceMembers = @($metadata.workspace_members)
            if ($workspaceMembers.Count -eq 1) {
              $package = $metadata.packages |
                Where-Object { $_.id -eq $workspaceMembers[0] } |
                Select-Object -First 1
            }
          }

          if (-not $package) {
            throw 'Unable to determine package from Cargo metadata.'
          }

          $binTargets = @($package.targets | Where-Object { $_.kind -contains 'bin' } | Select-Object -ExpandProperty name)
          if (-not $binTargets -or $binTargets.Count -eq 0) {
            throw 'No binary target found in Cargo metadata.'
          }

          $binaryName = if (-not [string]::IsNullOrWhiteSpace($package.default_run)) {
            $package.default_run
          } elseif ($binTargets.Count -eq 1) {
            $binTargets[0]
          } else {
            throw 'Multiple binary targets found. Set `package.default-run` in Cargo.toml to choose release binary.'
          }

          "release_tag=$releaseTag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "binary_name=$binaryName" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Build release
        run: cargo build --release --bin "${{ steps.resolve.outputs.binary_name }}"

      - name: Create windows zip package
        id: package
        shell: pwsh
        env:
          BINARY_NAME: ${{ steps.resolve.outputs.binary_name }}
          REPO_NAME: ${{ github.event.repository.name }}
          RELEASE_TAG: ${{ steps.resolve.outputs.release_tag }}
        run: |
          $ErrorActionPreference = 'Stop'

          $exePath = Join-Path $PWD (Join-Path 'target/release' "$env:BINARY_NAME.exe")
          if (-not (Test-Path -Path $exePath -PathType Leaf)) {
            throw "Expected Windows executable not found: $exePath"
          }

          $safeTag = $env:RELEASE_TAG -replace '[^0-9A-Za-z._-]', '-'
          $zipName = "$($env:REPO_NAME)-$safeTag-windows-x64.zip"

          $bundleDir = Join-Path $PWD 'release-bundle'
          New-Item -ItemType Directory -Path $bundleDir -Force | Out-Null

          Copy-Item -Path $exePath -Destination $bundleDir -Force

          $readmeCandidates = @('README.md', 'README', 'README.txt', 'README.rst')
          $licenseCandidates = @('LICENSE', 'LICENSE.md', 'LICENSE.txt', 'LICENCE', 'LICENCE.md', 'COPYING', 'COPYING.md')
          $optionalFiles = @()

          foreach ($candidate in ($readmeCandidates + $licenseCandidates)) {
            if (Test-Path -Path $candidate -PathType Leaf) {
              $optionalFiles += $candidate
            }
          }

          $optionalFiles = $optionalFiles | Select-Object -Unique
          foreach ($file in $optionalFiles) {
            Copy-Item -Path $file -Destination $bundleDir -Force
          }

          $zipPath = Join-Path $PWD $zipName
          if (Test-Path -Path $zipPath) {
            Remove-Item -Path $zipPath -Force
          }

          $bundleFiles = Get-ChildItem -Path $bundleDir -File | Select-Object -ExpandProperty FullName
          if (-not $bundleFiles) {
            throw 'No files found to include in release bundle.'
          }

          Compress-Archive -Path $bundleFiles -DestinationPath $zipPath -Force

          "zip_path=$zipPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "release_tag=$env:RELEASE_TAG" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Ensure GitHub Release exists
        uses: actions/github-script@v7
        with:
          script: |
            const tag = '${{ steps.package.outputs.release_tag }}';
            const { owner, repo } = context.repo;
            try {
              await github.rest.repos.getReleaseByTag({ owner, repo, tag });
              core.info(`Release already exists for tag ${tag}`);
            } catch (error) {
              if (error.status === 404) {
                await github.rest.repos.createRelease({
                  owner,
                  repo,
                  tag_name: tag,
                  name: tag,
                  draft: false,
                  prerelease: false
                });
                core.info(`Created release for tag ${tag}`);
              } else {
                throw error;
              }
            }

      - name: Upload zip to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.package.outputs.release_tag }}
          files: ${{ steps.package.outputs.zip_path }}
          fail_on_unmatched_files: true
          overwrite_files: true
