name: Release Windows Zip Bundle

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to upload the asset to (e.g. v1.0.0)'
        required: true
        type: string

jobs:
  build-and-release-zip:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_type == 'tag' && github.ref || github.event.inputs.tag }}

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build release
        run: cargo build --release

      - name: Create windows zip package
        id: package
        shell: pwsh
        env:
          DISPATCH_TAG: ${{ github.event.inputs.tag }}
          REPO_NAME: ${{ github.event.repository.name }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          $ErrorActionPreference = 'Stop'

          $metadata = cargo metadata --no-deps --format-version 1 | ConvertFrom-Json
          $rootManifestPath = (Resolve-Path 'Cargo.toml').Path
          $package = $metadata.packages |
            Where-Object { (Resolve-Path $_.manifest_path).Path -eq $rootManifestPath } |
            Select-Object -First 1
          if (-not $package) {
            $package = $metadata.packages | Select-Object -First 1
          }

          $binTargets = @($package.targets | Where-Object { $_.kind -contains 'bin' } | Select-Object -ExpandProperty name)
          if (-not $binTargets -or $binTargets.Count -eq 0) {
            throw 'No binary target found in Cargo metadata.'
          }

          $binaryName = if (-not [string]::IsNullOrWhiteSpace($package.default_run)) {
            $package.default_run
          } elseif ($binTargets.Count -eq 1) {
            $binTargets[0]
          } else {
            throw 'Multiple binary targets found. Set `package.default-run` in Cargo.toml to choose release binary.'
          }

          $exePath = Join-Path $PWD (Join-Path 'target/release' "$binaryName.exe")
          if (-not (Test-Path -Path $exePath -PathType Leaf)) {
            throw "Expected Windows executable not found: $exePath"
          }

          $releaseTag = if ($env:REF_TYPE -eq 'tag') { $env:REF_NAME } else { $env:DISPATCH_TAG }
          if ([string]::IsNullOrWhiteSpace($releaseTag)) {
            throw 'Release tag is required (tag push or workflow_dispatch input).'
          }

          $safeTag = $releaseTag -replace '[^0-9A-Za-z._-]', '-'
          $zipName = "$($env:REPO_NAME)-$safeTag-windows-x64.zip"

          $bundleDir = Join-Path $PWD 'release-bundle'
          New-Item -ItemType Directory -Path $bundleDir -Force | Out-Null

          Copy-Item -Path $exePath -Destination $bundleDir -Force

          $readmeCandidates = @('README.md', 'README', 'README.txt', 'README.rst')
          $licenseCandidates = @('LICENSE', 'LICENSE.md', 'LICENSE.txt', 'LICENCE', 'LICENCE.md', 'COPYING', 'COPYING.md')
          $optionalFiles = @()

          foreach ($candidate in ($readmeCandidates + $licenseCandidates)) {
            if (Test-Path -Path $candidate -PathType Leaf) {
              $optionalFiles += $candidate
            }
          }

          $optionalFiles = $optionalFiles | Select-Object -Unique
          foreach ($file in $optionalFiles) {
            Copy-Item -Path $file -Destination $bundleDir -Force
          }

          $zipPath = Join-Path $PWD $zipName
          if (Test-Path -Path $zipPath) {
            Remove-Item -Path $zipPath -Force
          }

          Compress-Archive -Path (Join-Path $bundleDir '*') -DestinationPath $zipPath -Force

          "zip_path=$zipPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "release_tag=$releaseTag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Upload zip to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.package.outputs.release_tag }}
          files: ${{ steps.package.outputs.zip_path }}
          fail_on_unmatched_files: true
